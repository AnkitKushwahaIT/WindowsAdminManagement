name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and isolated cleanup behavior tests
        shell: powershell
        run: .\tests\Test-LocalAdminCleanup.ps1
      - name: Check original account script syntax without executing
        shell: powershell
        run: |
          Get-ChildItem .\scripts\LocalAdminAccount\*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Temporary administrator grant and removal tests
        shell: powershell
        run: .\tests\Test-TemporaryAdmin.ps1
